services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragchat
      POSTGRES_PASSWORD: ragchat
      POSTGRES_DB: ragchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchat -d ragchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://ragchat:ragchat@db:5432/ragchat
      COHERE_API_KEY: ${COHERE_API_KEY:?set COHERE_API_KEY in your environment or .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in your environment or .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
