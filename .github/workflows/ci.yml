name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: Mypy (type check)
        run: mypy

      - name: Pytest
        # The default suite runs with no API keys and no live database (embeddings/LLM/
        # pgvector are faked; the relational layer runs on SQLite in-memory). Integration
        # tests are deselected here and run in the job below.
        run: pytest --cov=ragchat --cov-report=term-missing

  integration:
    name: Integration (real pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (integration only)
        # Real ingest -> pgvector similarity search -> purge. Embeddings/LLM are faked,
        # so no API keys are needed; only a live pgvector database.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragchat
          COHERE_API_KEY: unused-in-integration
          GOOGLE_API_KEY: unused-in-integration
        run: pytest -m integration -o addopts="-ra -q --strict-markers"
