# Alembic config for local CLI use (e.g. `alembic revision --autogenerate -m "..."`).
# The database URL and schema come from the application (see migrations/env.py), so no
# sqlalchemy.url is set here. At runtime the app bootstraps migrations via
# ragchat.db.engine.init_db(); this file is for authoring new revisions.
[alembic]
script_location = src/ragchat/migrations
prepend_sys_path = src
