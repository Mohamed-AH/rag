# Render Blueprint — deploy the web UI + API for free.
# Database is external (Neon); set the three secrets in the Render dashboard.
# Expired-session cleanup runs via GitHub Actions (Render's free tier has no cron):
# see .github/workflows/cleanup.yml. Full instructions in DEPLOY.md.

services:
  # The FastAPI service: JSON API + built-in web UI at /.
  - type: web
    name: packetaudit
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # Neon pooled connection string (sslmode=require)
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: USAGE_HASH_SALT          # salt for hashing client IPs in the rate-limit counters
        sync: false                    # set a real secret in the dashboard (not the default)
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: DAILY_REQUEST_BUDGET
        value: "1000"                # instance-wide /ask budget per day
      # Audit path is metered separately (one audit = one model call per file) and keyed on
      # hashed client IP, so dropping the session cookie can't reset it. Tune to taste.
      - key: DAILY_AUDIT_FREE_ALLOWANCE
        value: "15"                  # shared-key audits/day per IP before BYO key is required
      - key: DAILY_AUDIT_BUDGET
        value: "150"                 # instance-wide audit ceiling per day (free-tier safety)
      - key: MAX_UPLOAD_BYTES
        value: "2097152"           # 2 MiB
      # --- Packet auditor (Phase 1) ---
      - key: ACTIVE_CHECKLIST
        value: "customs"
      - key: MAX_FILES_PER_PACKET
        value: "25"
      # Flash-Lite is natively multimodal, so one lite tier (most generous free quota)
      # reads both text and scans. Point VISION_MODEL at a heavier multimodal model
      # only if real scans need more OCR accuracy.
      - key: LLM_MODEL
        value: "gemini-flash-lite-latest"
      - key: VISION_MODEL
        value: "gemini-flash-lite-latest"
      # --- Audit model fallback ladder ---
      # When Gemini's free quota is exhausted, the audit retries the same call on the next
      # available provider. A rung engages only once its key (set below as a dashboard
      # secret) is present, so the app runs on Gemini alone until you add them. Model ids
      # are tunable here because free model names churn.
      - key: AUDIT_MODEL_ORDER
        value: "gemini,mistral,groq"
      - key: MISTRAL_API_KEY        # free tier — enables the mistral rung (Ministral-3B, multimodal)
        sync: false
      - key: GROQ_API_KEY           # free tier — enables the groq rung (gpt-oss-120b text + Qwen-VL scans)
        sync: false
      # OpenRouter (openai_compat) is supported but off by default. To enable, add
      # 'openai_compat' to AUDIT_MODEL_ORDER and set OPENAI_COMPAT_API_KEY / _BASE_URL / _MODEL.
      - key: LOG_LEVEL
        value: "INFO"
